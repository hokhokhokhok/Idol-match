name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
      - run: node --test jomun/tests/*.test.js
      - run: node scripts/build-www.mjs
      # 민법 모의고사 앱(civil-exam/)을 /Idol-match/civil-exam/ 하위 경로로 함께 배포
      - name: Build civil-exam
        working-directory: civil-exam
        env:
          BASE: /Idol-match/civil-exam/
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npm test
          npm run build
      - run: cp -r civil-exam/dist www/civil-exam
      # 조문 암기 트레이너(jomun/)는 빌드 없이 정적 파일 그대로 /Idol-match/jomun/ 에 배포
      - run: |
          mkdir www/jomun
          cp -r jomun/index.html jomun/sw.js jomun/manifest.webmanifest jomun/js jomun/icons jomun/data www/jomun/
      # 마곡 뮤지컬 학원 찾기(magok-academy/)는 Next.js 정적 내보내기로 /Idol-match/magok-academy/ 에 배포
      - name: Build magok-academy
        working-directory: magok-academy
        env:
          BASE_PATH: /Idol-match/magok-academy
          NEXT_PUBLIC_CORRECTION_URL: ${{ vars.MAGOK_CORRECTION_URL }}
        run: |
          npm ci
          npm test
          npm run check:data
          npm run build
      - run: cp -r magok-academy/out www/magok-academy && touch www/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
