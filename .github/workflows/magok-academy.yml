name: magok-academy
on:
  pull_request:
    paths: ['magok-academy/**', '.github/workflows/magok-academy.yml']
  push:
    branches: [main]
    paths: ['magok-academy/**', '.github/workflows/magok-academy.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magok-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: magok-academy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:data
      - run: npm run build
