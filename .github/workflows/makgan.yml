name: makgan
on:
  pull_request:
    paths: ['makgan/**', '.github/workflows/makgan.yml']
  push:
    branches: [main]
    paths: ['makgan/**', '.github/workflows/makgan.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: makgan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: makgan/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # supabase/setup.sql이 마이그레이션과 같은지
      - run: npm run db:bundle -- --check
      - run: npm test
      # 러너에 설치된 PostgreSQL 16으로 임시 클러스터를 띄워 스키마·RLS 테스트
      - run: npm run test:db
      # Supabase 값 없이도 빌드되는지
      - run: npm run build
      # 로컬 Supabase 대역(Postgres + PostgREST + 가짜 Auth)으로 E2E
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: makgan-screenshots
          path: makgan/screenshots
