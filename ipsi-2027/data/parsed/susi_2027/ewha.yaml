    type: 종합
    grad_ok: true
    grad_note: 고교 졸업자(2027년 2월 졸업예정자 포함) 또는 동등 학력
    grad_page: 16
    min_page: 16
    min_text: "인문: 국어 포함 2개 영역 합 5 / (인문 일부 모집단위: 국어 포함 2개 합 5 및 영어 2등급 — 모집단위명 추출 누락, 원문 확인) / 자연: 수학 포함 2개 합 5 / 의예: 4개 합 5 / 약학: 4개 합 6 / 스크랜튼: 3개 합 5. 탐구 상위 1과목"
    min_req:
