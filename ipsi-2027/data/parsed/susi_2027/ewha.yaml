        rule: {pool: [국, 수, 영, 탐], pick: 2, sum_max: 5, must_all: [수], inq: best1}
      - units: 의예과
        rule: {pool: [국, 수, 영, 탐], pick: 4, sum_max: 5, inq: best1}
      - units: 약학전공
        rule: {pool: [국, 수, 영, 탐], pick: 4, sum_max: 6, inq: best1}
      - units: 스크랜튼학부
        rule: {pool: [국, 수, 영, 탐], pick: 3, sum_max: 5, inq: best1}
