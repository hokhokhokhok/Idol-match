        rule: {pool: [국, 수, 영, 탐], pick: 2, sum_max: 5, must_all: [국], inq: best1}
      - units: "인문계열 일부(영어 2등급 추가 — 원문 16쪽 확인)"
        rule: {pool: [국, 수, 영, 탐], pick: 2, sum_max: 5, must_all: [국], inq: best1, extra: {영: 2}}
