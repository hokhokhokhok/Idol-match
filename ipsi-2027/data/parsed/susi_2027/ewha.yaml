    type: 교과
    grad_ok: true
    grad_year_min: 2026
    grad_note: 2026년 2월 이후 국내 고교 졸업자(2027년 2월 졸업예정자 포함), 학교폭력 기재 시 지원 불가
    grad_page: 14
    min_page: 14
    min_text: "국어, 수학, 영어, 탐구(사회/과학) 4개 영역 중 2개 영역 등급 합 5 이내. 제2외국어/한문 불인정"
    min_req:
      - units: 전 모집단위
        rule: {pool: [국, 수, 영, 탐], pick: 2, sum_max: 5, inq: best1}
    events:
      - {kind: 최초합격발표, date: 2026-12-17}
    events_page: 8
