notes:
  - "탐구는 응시 과목 중 상위 1개 과목 등급, 제2외국어/한문 불인정"
  - "인문계열(국제학부 포함)은 국어, 자연계열(의예·약학 포함)은 수학 응시 필수"
  - "최초합격 발표가 12월 17일(목)로 대교협 마감(12.18)보다 하루 빠름"
tracks:
