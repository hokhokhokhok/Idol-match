advice:
  - title: 최저가 애매하면 일단 응시
    body: 최저 충족이 불확실하면 등급컷이 예상과 달라질 수 있어 응시가 유리하다는 조언. 예년에도 확정 성적으로 최저를 맞춘 사례가 적지 않았음.
    source: kbc 2026.11.19
    url: https://news.ikbc.co.kr/article/view/kbc202611190066
  - title: 가장 보수적인 컷으로 판단
    body: 기관마다 등급컷 예측이 달라, 여러 기관 중 가장 보수적인 값으로 내 등급을 잡으라는 조언.
    source: kbc 2026.11.19
    url: https://news.ikbc.co.kr/article/view/kbc202611190066
  - title: 탐구는 가채점만으로 단정 금지
    body: 과목별 응시 집단과 점수 분포에 따라 실제 등급·표준점수가 크게 달라질 수 있음.
    source: 메트로신문 2026.11.16
    url: https://www.metroseoul.co.kr/article/20261116500358
traps:   # 최저 계산 함정 — 2027 수시 모집요강 근거
  - title: 탐구 1과목 vs 2과목 평균
    body: 고려대는 탐구 1과목(수시요강 6쪽), 성균관대 융합인재는 2과목 평균(13쪽).
  - title: 2과목 평균 소수점
    body: 중앙대 논술은 소수점 그대로 반영(60쪽). 3개 합 6 기준에서 합 6.5면 미충족.
  - title: 영어 1·2등급 통합
    body: 중앙대는 영어 2등급을 1등급으로 간주(19쪽).
  - title: 한국사 별도 기준
    body: 고려대·서강대·중앙대 4등급 이내, 경희대 5등급 이내를 따로 요구.
  - title: 과목 포함 조건
    body: 연세대 교과 인문은 국어·수학 중 1개 포함 2개 합 4, 자연은 수학 포함 2개 합 5(26쪽).
