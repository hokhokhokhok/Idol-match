- 배치표는 영어를 뺀 국수탐 원점수 합이라 영어 등급에 따라 변동이 큼 (광주진협)
- 서울대 자연·의약은 수학 미적분·기하, 과학탐구 응시가 지원 조건 (서울대 정시요강)
- '수학 표준점수 최고점 추정: 미적분·기하 139, 확률과통계 137 — 같은 원점수라도 표준점수가 다를 수 있음 (파이낸셜뉴스 2026.11.22)'
- 295점 이상 최상위는 기관끼리 최대 6점 차이 — 원점수 합만으로 판정이 어려워 성적 발표 후 표준점수로 다시 봐야 함
