# 2027 정시 가채점 기준 예상 합격선 (국어+수학+탐구2과목 원점수 합, 300점 만점)
# 학원 추정치 — 공식 자료 아님. 기사 원문을 열어 숫자를 그대로 옮김(2026-11-24). 성적 발표 후 표준점수·백분위·대학별 환산으로 다시 판단해야 함.
# 유료·회원 전용 배치표는 수집하지 않음. 언론에 공개된 수치만.
